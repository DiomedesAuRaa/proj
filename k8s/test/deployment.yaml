apiVersion: v1
kind: Namespace
metadata:
  name: candidate-api-test
  labels:
    environment: test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: candidate-api
  namespace: candidate-api-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: candidate-api
  namespace: candidate-api-test
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: candidate-api
  namespace: candidate-api-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: candidate-api
subjects:
  - kind: ServiceAccount
    name: candidate-api
    namespace: candidate-api-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: candidate-api-config
  namespace: candidate-api-test
data:
  appsettings.json: |
    {
      "CandidateApi": {
        "ServiceName": "candidate-api",
        "Region": "us-central-1",
        "Dependencies": [
          {
            "Name": "postgres",
            "Type": "database",
            "Healthy": true
          },
          {
            "Name": "redis",
            "Type": "cache",
            "Healthy": true
          },
          {
            "Name": "third-party-billing",
            "Type": "http",
            "Healthy": true
          }
        ],
        "WorkItems": []
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: candidate-api-blue
  namespace: candidate-api-test
  labels:
    app: candidate-api
    version: blue
    environment: test
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: candidate-api
      slot: blue
  template:
    metadata:
      labels:
        app: candidate-api
        slot: blue
        version: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: candidate-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: candidate-api
        image: ghcr.io/your-org/candidate-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: DOTNET_RUNNING_IN_CONTAINER
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: config
        configMap:
          name: candidate-api-config
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - candidate-api
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: candidate-api
  namespace: candidate-api-test
  labels:
    app: candidate-api
    environment: test
spec:
  type: ClusterIP
  selector:
    app: candidate-api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: candidate-api
  namespace: candidate-api-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: candidate-api-blue
  minReplicas: 3
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: candidate-api
  namespace: candidate-api-test
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: candidate-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: candidate-api-default-deny
  namespace: candidate-api-test
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: candidate-api-allow-ingress
  namespace: candidate-api-test
spec:
  podSelector:
    matchLabels:
      app: candidate-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: candidate-api-allow-egress
  namespace: candidate-api-test
spec:
  podSelector:
    matchLabels:
      app: candidate-api
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
